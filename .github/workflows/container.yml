name: Container Image
on:
  push:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Semver image version without a leading v
        required: false
        type: string
permissions:
  contents: read
  packages: write
jobs:
  images:
    uses: abhi1693/actions/.github/workflows/container-images.yml@v1
    with:
      manifest: .github/images.json
      publish: true
      version: ${{ inputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
